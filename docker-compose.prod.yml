# Prod stack — runs alongside the dev stack (docker-compose.yml) on the same
# machine, so every service here uses a distinct named volume. No `ollama`
# here — that's shared with dev via the standalone docker-compose.llm.yml
# stack (one GPU, stateless inference, no reason to run it twice) — start
# that first.
#
# Secrets/host-specific values come from .env.prod (see .env.prod.example).
# Always run with an explicit project name and env file:
#
#   docker compose -p aria-prod -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# No --reload / bind mounts — code changes require rebuilding with the same
# command above.
#
# Only `caddy` (80/443) is exposed to the host — it's the sole public entry
# point (real domain, automatic HTTPS via Let's Encrypt). Every other
# service is internal-only, reachable from the host for debugging via
# `docker compose -p aria-prod ... exec <service> ...` (same as the backup/
# restore/migration scripts already do) rather than a published port. If
# this ever needs to run alongside another app's own Caddy on the same
# machine, only one can hold host ports 80/443 at a time — see README.md.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data_prod:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-store:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE: core-api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      CORE_API_MONGO_URI: mongodb://mongo:27017
      CORE_API_MONGO_DB_NAME: aria
      CORE_API_S3_ENDPOINT_URL: http://minio:9000
      CORE_API_S3_BUCKET: aria-documents
      CORE_API_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CORE_API_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CORE_API_S3_REGION: us-east-1
      CORE_API_CELERY_BROKER_URL: redis://redis:6379/0
      CORE_API_ADMIN_PASSWORD: ${CORE_API_ADMIN_PASSWORD}
      CORE_API_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      # Real public HTTPS via Caddy now — the session cookie should never
      # go out over plain HTTP. Unset/false in dev (docker-compose.yml has
      # no such override), where the stack is only ever http://localhost.
      CORE_API_COOKIE_SECURE: "true"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE: ai-service
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    environment:
      AI_SERVICE_CHROMA_HOST: chromadb
      AI_SERVICE_CHROMA_PORT: 8000
      AI_SERVICE_CORE_API_URL: http://core-api:8000
      AI_SERVICE_OLLAMA_HOST: http://ollama:11434
      AI_SERVICE_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      AI_SERVICE_EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      AI_SERVICE_MODEL_ADAPTER: qwen
      AI_SERVICE_RAG_TOP_K: 4
      AI_SERVICE_RAG_MAX_DISTANCE: 0.9
      AI_SERVICE_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      AI_SERVICE_REDIS_URL: redis://agent-store:6379/0
      AI_SERVICE_SEARCH_PROVIDER: brave
      AI_SERVICE_WEATHER_PROVIDER: open_meteo
      AI_SERVICE_BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    depends_on:
      chromadb:
        condition: service_healthy
      agent-store:
        condition: service_healthy
    # `ollama` lives in the standalone docker-compose.llm.yml stack, shared
    # with dev — start that first (Compose can't express depends_on across
    # compose projects).
    networks:
      - default
      - aria-llm-net

  mcp-server:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE: ai-service
    command: uv run python -m app.mcp_server
    restart: unless-stopped
    ports:
      - "8013:8003"
    environment:
      AI_SERVICE_CORE_API_URL: http://core-api:8000
      AI_SERVICE_MCP_SERVER_PORT: 8003
    depends_on:
      core-api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE: worker
    command: uv run celery -A app.celery_app worker --loglevel=INFO
    restart: unless-stopped
    environment:
      WORKER_BROKER_URL: redis://redis:6379/0
      WORKER_RESULT_BACKEND: redis://redis:6379/1
      WORKER_MONGO_URI: mongodb://mongo:27017
      WORKER_MONGO_DB_NAME: aria
      WORKER_S3_ENDPOINT_URL: http://minio:9000
      WORKER_S3_BUCKET: aria-documents
      WORKER_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      WORKER_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      WORKER_S3_REGION: us-east-1
      WORKER_CHROMA_HOST: chromadb
      WORKER_CHROMA_PORT: 8000
      WORKER_OLLAMA_HOST: http://ollama:11434
      WORKER_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      WORKER_EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      WORKER_SMTP_HOST: ${WORKER_SMTP_HOST}
      WORKER_SMTP_PORT: ${WORKER_SMTP_PORT:-587}
      WORKER_SMTP_USERNAME: ${WORKER_SMTP_USERNAME}
      WORKER_SMTP_PASSWORD: ${WORKER_SMTP_PASSWORD}
      WORKER_SMTP_USE_TLS: ${WORKER_SMTP_USE_TLS:-true}
      WORKER_SMTP_FROM_ADDRESS: ${WORKER_SMTP_FROM_ADDRESS}
      WORKER_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    # See ai-service's comment above — shared `ollama` stack.
    networks:
      - default
      - aria-llm-net

  worker-beat:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE: worker
    command: uv run celery -A app.celery_app beat --loglevel=INFO
    restart: unless-stopped
    environment:
      WORKER_BROKER_URL: redis://redis:6379/0
      WORKER_RESULT_BACKEND: redis://redis:6379/1
      WORKER_MONGO_URI: mongodb://mongo:27017
      WORKER_MONGO_DB_NAME: aria
      # No WORKER_SMTP_*/FRONTEND_ORIGIN here — beat only enqueues
      # send_overdue_digest, it never calls send_mail itself (that's the
      # `worker` process), so it has no need for the SMTP relay credential.
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
      target: prod
      args:
        VITE_CORE_API_URL: ${VITE_CORE_API_URL}
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL}
    restart: unless-stopped
    depends_on:
      - core-api
      - ai-service

  # Sole public entry point — see the block comment at the top of this file.
  # Auto-provisions and renews HTTPS for CADDY_DOMAIN via Let's Encrypt; no
  # cert files to manage by hand. See ./Caddyfile for the routing rules.
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    depends_on:
      - frontend
      - core-api
      - ai-service

networks:
  default:
  aria-llm-net:
    external: true

volumes:
  mongo_data_prod:
  chroma_data_prod:
  minio_data_prod:
  caddy_data_prod:
  caddy_config_prod:
