[project]
name = "aria-shared"
version = "0.1.0"
description = "Shared Pydantic domain models for ARIA services (see docs/data-model.md)"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.7",
    "fastapi>=0.115",
    "boto3>=1.35",
    "chromadb>=0.5",
    # zoneinfo (aria_shared.timezones) needs an IANA tz database; the shared
    # Docker base (python:3.12-slim) doesn't apt-install tzdata and Debian
    # slim images don't ship one, so this is a hard runtime dependency, not
    # a Windows-only fallback.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria_shared"]
